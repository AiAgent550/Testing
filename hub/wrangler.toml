# Curve Hub (Curve Performance): one Cloudflare Worker serving the dashboard, the API and scheduled jobs.
name = "curve-hub"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [{ pattern = "hub.curveperformance.co.uk", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true          # every request passes the auth gate in src/index.ts first
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "curve-hub"
database_id = "0cdbafa6-68b0-461b-8872-0ec0bee6b001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "curve-hub-files"

[triggers]
crons = ["*/10 * * * *"]          # comment watcher and outbox sender

[vars]
# Production values. For local development .dev.vars overrides the two origins
# (APP_ORIGIN=http://localhost:8787, SITE_ORIGIN=http://localhost:8765; see .dev.vars.example).
APP_ORIGIN = "https://hub.curveperformance.co.uk"
SITE_ORIGIN = "https://curveperformance.co.uk"
BUSINESS_NAME = "Curve Performance"

# Secrets (never in this file). Set with `wrangler secret put NAME`, or .dev.vars locally:
#   ENCRYPTION_KEY      32 random bytes, base64 (encrypts 2FA secrets and platform tokens)
#   ANTHROPIC_API_KEY   AI suggestions and lead triage (features fall back gracefully without it)
#   DVLA_API_KEY        DVLA Vehicle Enquiry Service
#   DVSA_CLIENT_ID, DVSA_CLIENT_SECRET, DVSA_API_KEY, DVSA_TOKEN_URL, DVSA_SCOPE   MOT history API
#   META_APP_SECRET, YOUTUBE_API_KEY, TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET     social platforms
#   META_APP_ID         with META_APP_SECRET: Facebook Login for Instagram + Facebook Pages
#                       (redirect URI to register: <APP_ORIGIN>/api/social/connect/meta/callback)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   Google OAuth for YouTube comments
#                       (redirect URI to register: <APP_ORIGIN>/api/social/connect/google/callback)
